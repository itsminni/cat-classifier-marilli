version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: uv
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: dependencies
    schedule:
      interval: weekly
    groups:
      python-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: dependencies
    schedule:
      interval: weekly
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
