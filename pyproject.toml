[project]
name = "cat-classifier-marilli"
version = "0.1.0"
description = "Classificatore di razze feline per la challenge Premio Marilli 2026"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "catboost==1.2.10",
    "matplotlib==3.11.2",
    "numpy==2.4.6",
    "pandas==3.1.0",
    "scikit-learn==1.9.1",
    "seaborn==0.13.2",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.2",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
